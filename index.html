<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Aprende Inglés</title>
    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

<div class="background"></div>

<div class="card">

    <h1>🌟 Aprendamos Inglés 🌟</h1>
    <p>Ingresa tu nombre y elige tu avatar</p>

    <input type="text" id="nombre" placeholder="Escribe tu nombre">

    <h2>Elige tu avatar</h2>

    <div class="avatars">

        <img src="img/avatar1.png" class="avatar" onclick="selectAvatar(this)">
        <img src="img/avatar2.png" class="avatar" onclick="selectAvatar(this)">
        <img src="img/avatar3.png" class="avatar" onclick="selectAvatar(this)">
        <img src="img/avatar4.png" class="avatar" onclick="selectAvatar(this)">
        <img src="img/avatar5.png" class="avatar" onclick="selectAvatar(this)">
        <img src="img/avatar6.png" class="avatar" onclick="selectAvatar(this)">

    </div>

    <button onclick="start()">🚀 Comenzar</button>

    <audio id="clickSound" src="sonido/click.mp3"></audio>

</div>

<script src="js/scrip.js"></script>

</body>
</html>
