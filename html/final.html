<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Graduación Matemática</title>

<link rel="icon" href="../IMG/favicon.png">

<link rel="stylesheet" href="../CSS/final.css">

</head>

<body>

<div id="fuegos"></div>

<div class="contenedor">

    <h1>
        🎓 GRADUACIÓN MATEMÁTICA 🎓
    </h1>

    <img
    id="avatarJugador"
    class="avatarGrande">

    <h2 id="nombreJugador"></h2>

    <div id="medallaFinal" class="medalla"></div>

    <div class="estadisticas">

        <p>
            ⭐ Respuestas Correctas:
            <span id="buenas"></span>
        </p>

        <p>
            ❌ Errores Totales:
            <span id="malas"></span>
        </p>

        <p>
            📈 Porcentaje de Logro:
            <span id="porcentaje"></span>
        </p>

    </div>

    <div class="diploma">

        <h2>
            🏆 DIPLOMA OFICIAL 🏆
        </h2>

        <p>

            Se certifica que

            <strong id="nombreDiploma"></strong>

            completó exitosamente todos los
            desafíos matemáticos de 4° Básico.

        </p>

    </div>

    <button onclick="reiniciarAventura()">

        🔄 Volver al Inicio

    </button>

</div>

<script src="../JS/final.js"></script>

</body>

</html>
