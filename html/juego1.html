<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Mundo de los Colores</title>
    <link rel="stylesheet" href="../img/favicon.png">
    <link rel="stylesheet"
    href="../css/juego1.css">

</head>

<body>

    <div class="contenedor">

        <!-- TITULO -->

        <h1 class="titulo">

            🌈 Bienvenido al Mundo de los Colores 🌈

        </h1>

        <!-- PANEL -->

        <div class="panel">

            <div class="caja correctas">

                ✅ Buenas:
                <span id="correctas">0</span>

            </div>

            <div class="caja errores">

                ❌ Malas:
                <span id="errores">0</span>

            </div>

            <div class="caja puntaje">

                ⭐ Puntaje:
                <span id="puntaje">0</span>

            </div>

        </div>

        <!-- BOTONES -->

        <div class="botones">

            <button id="btnInstrucciones">

                🎮 ¿Cómo jugar?

            </button>

            <button id="btnColor">

                🔊 Escuchar Color

            </button>

        </div>

        <!-- JUEGO -->

        <div class="zonaJuego">

            <!-- GLOBO -->

            <div class="globoZona">

                <img id="imagenColor"
                src="../img/rojo.png">

            </div>

            <!-- PALABRAS -->

            <div class="palabras">

                <div draggable="true"
                class="palabra"
                id="red">

                    RED

                </div>

                <div draggable="true"
                class="palabra"
                id="blue">

                    BLUE

                </div>

                <div draggable="true"
                class="palabra"
                id="green">

                    GREEN

                </div>

                <div draggable="true"
                class="palabra"
                id="yellow">

                    YELLOW

                </div>

                <div draggable="true"
                class="palabra"
                id="purple">

                    PURPLE

                </div>

            </div>

        </div>

        <!-- MENSAJE -->

        <div id="mensaje"></div>

        <div id="efectos"></div>

        <button id="btnAvanzar">
        🚀 AVANZAR
        </button>

    </div>

    <!-- AUDIOS -->

    <audio id="audioCorrecto"
    src="../sonido/correcto.mp3"></audio>

    <audio id="audioIncorrecto"
    src="../sonido/incorrecto.mp3"></audio>

    <audio id="audioLogro"
    src="../sonido/logro.mp3"></audio>

    <script src="../js/juego1.js"></script>

</body>

</html>
