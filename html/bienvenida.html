<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Bienvenida</title>
    <link rel="icon" href="../img/favicon.png">

   <link rel="stylesheet" href="../css/bienvenida.css">

</head>

<body>

<div class="background"></div>

<div class="welcome-card">

    <h1 class="titulo-bienvenida">
        🌟 ¡Bienvenido! 🌟
    </h1>

    <img id="avatarUsuario" class="avatar-bienvenida">

    <h2 id="nombreUsuario"></h2>

    <p class="mensaje">
        ¡Estamos listos para aprender inglés juntos!
    </p>

    <button class="boton-aprender" onclick="irActividad()">
        🚀 Continuar al aprendizaje
    </button>

</div>

<script>

let nombre = localStorage.getItem("nombre");
let avatar = localStorage.getItem("avatar");

document.getElementById("nombreUsuario").innerHTML = nombre;

document.getElementById("avatarUsuario").src = avatar;

function hablar(texto){

    let voz = new SpeechSynthesisUtterance(texto);

    voz.lang = "es-ES";

    voz.rate = 0.9;

    voz.pitch = 1.3;

    speechSynthesis.cancel();

    speechSynthesis.speak(voz);
}

window.onload = function(){

    setTimeout(() => {

        hablar("Bienvenido " + nombre);

    },500);

    setTimeout(() => {

        hablar("Estamos listos para aprender inglés juntos");

    },3000);
};

/* FUNCIÓN PARA IR A LA ACTIVIDAD */

function irActividad(){

    window.location.href = "actividad1.html";
}

</script>

</body>
</html>
